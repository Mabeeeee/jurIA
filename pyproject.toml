[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Les fonctions de test `async def` sont executees automatiquement dans une
# boucle asyncio (plugin pytest-asyncio), sans decorateur a ajouter.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    # Warning interne a une dependance de Chainlit (traceloop), hors de notre controle
    "ignore::DeprecationWarning:traceloop.*",
]
markers = [
    "chroma: test qui instancie une vraie base ChromaDB (dans un dossier temporaire)",
]
